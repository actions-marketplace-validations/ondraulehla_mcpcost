name: Watch the edge
# Every hour: who read the board, what it cost, and whether a scraper got past the zone's rules.
# A threshold crossed turns the run red and opens (or adds to) the issue labelled edge-watch.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      from:
        description: 'Start of the window, ISO 8601 UTC (default: an hour before the end)'
        required: false
      to:
        description: 'End of the window, ISO 8601 UTC (default: two minutes ago)'
        required: false
      quiet:
        description: 'Only write the report: no issue and no red run when a threshold is crossed (for a look back at a past window)'
        type: boolean
        required: false
        default: false
      events:
        description: 'Also keep one line per request (shape, status, CPU and wall time, data centre; no address or agent string) as an artifact, for a closer look at the CPU'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  issues: write
  actions: read # the window step reads when the previous scheduled run was
concurrency:
  group: watch
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Pick the window
        id: window
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # GitHub runs a schedule late and skips hours at times (three runs in the night of 2026-10-23, not twelve).
        # A scheduled run starts where the previous scheduled run ended, up to a day back, so no hour goes unwatched.
        run: |
          from="${{ inputs.from }}"
          if [ -z "$from" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            # Without the previous run (the first schedule, or an API error) the window is the last hour, as before.
            prev=$(gh run list --workflow watch.yml --event schedule --status completed --limit 1 --json createdAt --jq '.[0].createdAt // empty' || true)
            floor=$(date -u -d '24 hours ago' +%FT%TZ)
            if [ -n "$prev" ]; then
              from=$(date -u -d "$prev 3 minutes ago" +%FT%TZ)
              [ "$from" \< "$floor" ] && from=$floor
            fi
          fi
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "window starts at ${from:-one hour ago}"
      - name: Look at the window
        id: watch
        continue-on-error: true
        env:
          WATCH_REPORT_FILE: ${{ runner.temp }}/watch.md
          WATCH_EVENTS_FILE: ${{ inputs.events && format('{0}/events.json', runner.temp) || '' }}
        run: node site/edge/watch.mjs "${{ steps.window.outputs.from }}" "${{ inputs.to }}"
      - name: Keep the request lines
        if: ${{ inputs.events }}
        uses: actions/upload-artifact@v4
        with:
          name: watch-events
          path: ${{ runner.temp }}/events.json
          retention-days: 3
      - name: Open or update the edge-watch issue
        if: ${{ steps.watch.outcome == 'failure' && steps.watch.outputs.alarm != '' && !inputs.quiet }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALARM: ${{ steps.watch.outputs.alarm }}
        run: |
          report="${{ runner.temp }}/watch.md"
          { echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; cat "$report"; } > "${{ runner.temp }}/issue.md"
          open=$(gh issue list --label edge-watch --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "${{ runner.temp }}/issue.md"
            echo "added to issue #$open"
          else
            gh label create edge-watch --color d93f0b --description 'The edge watch found a scraper or a spike' 2>/dev/null || true
            gh issue create --title "Edge watch: $ALARM" --label edge-watch --body-file "${{ runner.temp }}/issue.md"
          fi
      - name: Fail the run when a threshold was crossed or Cloudflare could not be asked
        # A quiet run still fails when Cloudflare could not be asked (no alarm text); it only keeps quiet about thresholds.
        if: ${{ steps.watch.outcome == 'failure' && (steps.watch.outputs.alarm == '' || !inputs.quiet) }}
        run: exit 1
